<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SFK Wellness 邀请码</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1A3D2B;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 360px;
    width: 100%;
    background: #FFFFFF;
    color: #1A3D2B;
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .title { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #666; margin: 0 0 20px; }
  .code {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #1A3D2B;
    background: #F5F5F5;
    border-radius: 12px;
    padding: 16px 12px;
    margin: 0 0 8px;
    word-break: break-all;
  }
  .hint { font-size: 13px; color: #888; margin: 0 0 24px; }
  .steps {
    text-align: left;
    font-size: 14px;
    line-height: 1.8;
    margin: 0 0 24px;
    padding: 0;
    list-style: decimal;
    padding-left: 20px;
  }
  .store-note {
    font-size: 13px;
    color: #999;
    border-top: 1px solid #eee;
    padding-top: 16px;
  }
  .copy-btn {
    display: inline-block;
    background: #C9A84C;
    color: #1A3D2B;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="title">SFK Wellness 邀请码</p>
    <p class="subtitle">好友邀请你注册，一起获得 Token 奖励</p>
    <div class="code" id="codeText">——</div>
    <button class="copy-btn" id="copyBtn" onclick="copyCode()">复制邀请码</button>
    <p class="hint" id="copyHint"></p>
    <ol class="steps">
      <li>下载并打开 SFK Wellness App</li>
      <li>点击"注册"，在"邀请码（选填）"栏填入上面的码</li>
      <li>完成注册，你和好友各自获得 Token 奖励</li>
    </ol>
    <p class="store-note">
      <!-- App正式上架后，把下面这行换成真实的App Store/Play Store链接。
           现在还没上架，先不放一个会404的死链接。 -->
      App 即将上线，敬请期待
    </p>
  </div>
  <script>
    // 这个页面是Universal Links/App Links的兜底：手机上已经装了App时，
    // 点邀请链接会被系统直接拉起App本身（走AndroidManifest.xml/
    // apple-app-site-association里注册的/invite路径），压根不会加载
    // 到这个网页——只有没装App时，才会真正落到这里。所以这个页面唯一
    // 的责任就是"把邀请码用大字清楚地摆出来"，不需要处理跳转注册逻辑
    // （那是App装好之后，用户自己手动填邀请码栏完成的）。
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '';
    document.getElementById('codeText').textContent = code || '（邀请码缺失）';

    function copyCode() {
      if (!code) return;
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById('copyHint').textContent = '已复制到剪贴板';
      }).catch(function () {
        document.getElementById('copyHint').textContent = '复制失败，请手动选中邀请码';
      });
    }
  </script>
</body>
</html>
