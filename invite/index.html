<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SFK Wellness 邀请码</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1A3D2B;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 360px;
    width: 100%;
    background: #FFFFFF;
    color: #1A3D2B;
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .title { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #666; margin: 0 0 20px; }
  .subtitle-en { font-size: 12px; color: #888; margin: -14px 0 20px; }
  .code {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #1A3D2B;
    background: #F5F5F5;
    border-radius: 12px;
    padding: 16px 12px;
    margin: 0 0 8px;
    word-break: break-all;
  }
  .hint { font-size: 13px; color: #888; margin: 0 0 24px; }
  .steps {
    text-align: left;
    font-size: 14px;
    line-height: 1.8;
    margin: 0 0 24px;
    padding: 0;
    list-style: decimal;
    padding-left: 20px;
  }
  .store-note {
    font-size: 13px;
    color: #999;
    border-top: 1px solid #eee;
    padding-top: 16px;
  }
  .stores { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .store-link {
    display: block;
    border: 1px solid #1A3D2B;
    border-radius: 12px;
    padding: 10px 12px;
    color: #1A3D2B;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
  .copy-btn {
    display: inline-block;
    background: #C9A84C;
    color: #1A3D2B;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="title">SFK Wellness 邀请码</p>
    <!-- 10-09 创始人定：机构码（SFKB-）、推广商码（SFKP-）与不带码时用中性一句，不提好友与 Token 奖励（WALLET-2 §六 3）；
         只有个人邀请码（SFK-）显示原文案，由下方脚本切换。静态默认就是中性版：脚本没跑时也不会出现奖励说法。 -->
    <p class="subtitle" id="subtitle">欢迎使用 SFK Wellness，请下载 App 并用此邀请码注册</p>
    <p class="subtitle-en" id="subtitleEn">Welcome to SFK Wellness. Please download the app and sign up with this invite code.</p>
    <div class="code" id="codeText">——</div>
    <button class="copy-btn" id="copyBtn" onclick="copyCode()">复制邀请码</button>
    <p class="hint" id="copyHint"></p>
    <ol class="steps">
      <li>下载并打开 SFK Wellness App</li>
      <li>点击"注册"，在"邀请码（选填）"栏填入上面的码</li>
      <li id="step3">完成注册</li>
    </ol>
    <div class="store-note">
      <!-- TD-168（2026-09-22）：商店链接只对【已上架】的那家显示，由下方 STORES 开关控制。
           发布日「对应商店可下载后」在执行单那一步把开关打开再推送；未上架的一家⛔ 放链接（⛔ 放会 404 的死链接）。 -->
      <p id="comingSoon">App 即将上线，敬请期待</p>
      <div class="stores" id="stores" hidden>
        <a class="store-link" id="iosLink" hidden>在 App Store 下载</a>
        <a class="store-link" id="androidLink" hidden>在 Google Play 下载</a>
      </div>
    </div>
  </div>
  <script>
    // 这个页面是Universal Links/App Links的兜底：手机上已经装了App时，
    // 点邀请链接会被系统直接拉起App本身（走AndroidManifest.xml/
    // apple-app-site-association里注册的/invite路径），压根不会加载
    // 到这个网页——只有没装App时，才会真正落到这里。所以这个页面唯一
    // 的责任就是"把邀请码用大字清楚地摆出来"，不需要处理跳转注册逻辑
    // （那是App装好之后，用户自己手动填邀请码栏完成的）。
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '';
    document.getElementById('codeText').textContent = code || '（邀请码缺失）';
    // 个人邀请码（SFK- 加 6 位）才显示好友奖励文案；SFKB-／SFKP-／不带码保持中性版
    if (/^SFK-[A-Z0-9]{6}$/i.test(code)) {
      document.getElementById('subtitle').textContent = '好友邀请您注册，一起获得 Token 奖励';
      document.getElementById('subtitleEn').hidden = true;
      document.getElementById('step3').textContent = '完成注册，您和好友各自获得 Token 奖励';
    }

    // ── 商店开关（TD-168）：只有在对应商店【已可下载】时才改为 true，并在执行单那一步里推送 ──
    // iOS：appId 取 App Store Connect →「App 信息」→ Apple ID（纯数字）；为空 ⇒ ⛔ 显示 iOS 链接。
    const STORES = {
      ios: { live: true, appId: '6791440396' },
      android: { live: true, packageId: 'net.sfkey.health' },
    };
    // 安卓链接预留 referrer 参数位（供 TD-166 的 Google Play Install Referrer 读取）；
    // 取值格式为终端暂定 `sfk_code=<邀请码>`，TD-166 实现读取时以其为准再对齐。
    function playUrl() {
      let url = 'https://play.google.com/store/apps/details?id=' + encodeURIComponent(STORES.android.packageId);
      if (code) url += '&referrer=' + encodeURIComponent('sfk_code=' + code);
      return url;
    }
    let anyLive = false;
    if (STORES.ios.live && /^[0-9]+$/.test(STORES.ios.appId)) {
      const a = document.getElementById('iosLink');
      a.href = 'https://apps.apple.com/app/id' + STORES.ios.appId;
      a.hidden = false; anyLive = true;
    }
    if (STORES.android.live) {
      const a = document.getElementById('androidLink');
      a.href = playUrl();
      a.hidden = false; anyLive = true;
    }
    if (anyLive) {
      document.getElementById('stores').hidden = false;
      document.getElementById('comingSoon').hidden = true;
    }

    function copyCode() {
      if (!code) return;
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById('copyHint').textContent = '已复制到剪贴板';
      }).catch(function () {
        document.getElementById('copyHint').textContent = '复制失败，请手动选中邀请码';
      });
    }
  </script>
</body>
</html>
